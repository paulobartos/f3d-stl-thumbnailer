name: build-package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel cmake extra-cmake-modules qt6-base kio f3d git github-cli

      - name: Create unprivileged build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          chown -R builder:builder .
          cd packaging/arch
          sudo -u builder makepkg -f --noconfirm

      - name: Upload package to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" packaging/arch/*.pkg.tar.zst --clobber
